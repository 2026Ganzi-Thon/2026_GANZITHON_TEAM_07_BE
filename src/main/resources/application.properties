spring.application.name=ganzithon
spring.config.import=optional:file:.env[.properties]
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:ganzithon}?connectionTimeZone=UTC
spring.datasource.username=${DB_USERNAME:ganzithon}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}

auth.jwt.secret=${AUTH_JWT_SECRET}
auth.oauth.kakao.client-id=${KAKAO_CLIENT_ID:}
auth.oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
auth.oauth.kakao.redirect-uri=${KAKAO_REDIRECT_URI:}
auth.oauth.discord.client-id=${DISCORD_CLIENT_ID:}
auth.oauth.discord.client-secret=${DISCORD_CLIENT_SECRET:}
auth.oauth.discord.redirect-uri=${DISCORD_REDIRECT_URI:}
auth.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
auth.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
auth.oauth.google.redirect-uri=${GOOGLE_REDIRECT_URI:}
